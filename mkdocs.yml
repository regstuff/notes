site_name: Notes
theme:
  name: material # A beautiful theme with built-in instant search
plugins:
  - search
markdown_extensions:
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true

extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

extra_css:
  - stylesheets/extra.css

validation:
    links:
      anchors: warn
